name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bookmyfarm-dev/bmf-pipeline-templates/.github/workflows/python-service-ci.yml@v1
    with:
      image-name: bmf-listing-service