name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmf
          POSTGRES_PASSWORD: bmf
          POSTGRES_DB: listings_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bmf -d listings_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://bmf:bmf@localhost:5432/listings_test
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bmf-listing-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max