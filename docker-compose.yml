services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bmf
      POSTGRES_PASSWORD: bmf
      POSTGRES_DB: listings
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmf -d listings"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://bmf:bmf@db:5432/listings
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: